name: C++ Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC 14
            os: ubuntu-latest
            compiler: gcc
          - name: macOS Apple Clang
            os: macos-latest
            compiler: apple-clang
          - name: Windows MinGW
            os: windows-latest
            compiler: mingw

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC 14
        if: matrix.compiler == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14

      - name: Install MinGW
        if: matrix.compiler == 'mingw'
        shell: powershell
        run: |
          choco install mingw -y
          $env:Path += ";C:\ProgramData\chocolatey\bin"
          echo "$env:Path" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure GCC 14
        if: matrix.compiler == 'gcc'
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Show Apple Clang version
        if: matrix.compiler == 'apple-clang'
        run: |
          clang --version
          clang++ --version
          cmake --version

      - name: Configure macOS
        if: matrix.compiler == 'apple-clang'
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure Windows MinGW
        if: matrix.compiler == 'mingw'
        shell: bash
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          cmake \
            -S . \
            -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: movie-booking-service:ci

      - name: Docker image built successfully
        run: docker image inspect movie-booking-service:ci >/dev/null