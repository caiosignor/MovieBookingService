name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure

      - name: Package Linux artifact
        run: |
          mkdir -p dist
          cp build/bin/BookingServiceExecutable dist/
          cp README.md dist/
          tar -czf moviebookingservice-linux-x86_64.tar.gz -C dist .

      - name: Upload Linux release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            moviebookingservice-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW
        run: |
          choco install mingw -y

      - name: Configure
        shell: bash
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          cmake -S . -B build-mingw -G "MinGW Makefiles" \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          cmake --build build-mingw --parallel

      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build-mingw\bin\BookingServiceExecutable.exe dist\
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath moviebookingservice-windows-x86_64.zip -Force

      - name: Upload Windows release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            moviebookingservice-windows-x86_64.zip
